name: Run Flight Data Pipeline

# NOTE: GitHub Actions scheduled workflows can experience delays due to queue congestion.
# Scheduled runs may not execute precisely on the specified interval (e.g., may run every 6 hours instead of hourly).
# This is a known GitHub Actions limitation on free/shared runner infrastructure.
#
# Future improvement: This workflow will be triggered by Apache Airflow once implemented,
# providing more reliable scheduling and better orchestration.

on:
  schedule:
    # Runs at the top of every 6th hour (e.g., 00:00, 06:00, 12:00, etc. UTC)
    - cron: '0 */6 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dbt-duckdb

      - name: Run pipeline
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
        run: |
          python -m src.pipelines.run_pipeline

      - name: Commit data updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Pipeline run: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || true
          git push origin main
