
# Name your project! Project names should be lowercase and use underscores as spaces
name: 'aviationstack'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'aviationstack'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["models/tests"]
seed-paths: ["seeds"]
macro-paths: ["models/macros"]
snapshot-paths: ["snapshots"]
target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
models:
  aviationstack:
    # Materialization defaults
    +materialized: table
    +schema: analytics

    # Staging layer - cleaned, standardized data
    staging:
      +materialized: view
      +schema: staging
      stg_flights:
        +description: "Staging table for cleaned flight data"

    # Marts layer - business logic and aggregations
    marts:
      +materialized: table
      +schema: marts
      fct_flights:
        +description: "Fact table for flight operations"
      dim_airlines:
        +description: "Dimension table for airlines"
      dim_airports:
        +description: "Dimension table for airports"
